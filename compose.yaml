services:
  mcp:
    image: local/writer-base:latest
    build:
      context: .
      args:
        APP_UID: ${MCP_UID:-1000}
        APP_GID: ${MCP_GID:-1000}
    restart: unless-stopped
    init: true
    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"
    working_dir: /opt/workspace/${MCP_PROJECT_RELATIVE_PATH:-mymcp}
    command: ["sh", "scripts/start_mcp.sh"]
    environment:
      MCP_WORKSPACE_ROOT: /opt/workspace
      MCP_PROJECT_RELATIVE_PATH: ${MCP_PROJECT_RELATIVE_PATH:-mymcp}
      MCP_DRAFT_COMMIT_PASSWORD: ${MCP_DRAFT_COMMIT_PASSWORD:-change-this-password}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-Writing Workspace MCP}
      MCP_PORT: ${MCP_PORT:-8765}
      MCP_EXECUTION_HOME: /tmp/mcp-home
      MCP_CHATGPT_AUTOMATION_ENABLED: ${MCP_CHATGPT_AUTOMATION_ENABLED:-false}
      MCP_CHATGPT_BROWSER_CHANNEL: ${MCP_CHATGPT_BROWSER_CHANNEL:-}
      MCP_CHATGPT_BROWSER_HEADLESS: ${MCP_CHATGPT_BROWSER_HEADLESS:-true}
    volumes:
      - type: bind
        source: ${MCP_WORKSPACE_HOST_PATH:-..}
        target: /opt/workspace
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${MCP_PORT:-8765}:${MCP_PORT:-8765}"
      - "127.0.0.1:${MCP_DEBUG_VNC_PORT:-6081}:6080"
    shm_size: 1g
    mem_limit: ${MCP_MEMORY_LIMIT:-4g}
    cpus: ${MCP_CPU_LIMIT:-2.0}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  browser-login:
    profiles: ["login"]
    image: local/writer-base:latest
    build:
      context: .
      args:
        APP_UID: ${MCP_UID:-1000}
        APP_GID: ${MCP_GID:-1000}
    init: true
    user: "${MCP_UID:-1000}:${MCP_GID:-1000}"
    working_dir: /opt/workspace/${MCP_PROJECT_RELATIVE_PATH:-mymcp}
    command: ["sh", "scripts/start_browser_login.sh"]
    environment:
      MCP_CHATGPT_BROWSER_EXECUTABLE: ${MCP_CHATGPT_BROWSER_EXECUTABLE:-}
      MCP_CHATGPT_BROWSER_NO_SANDBOX: "true"
      MCP_VNC_GEOMETRY: ${MCP_VNC_GEOMETRY:-1440x900x24}
    volumes:
      - type: bind
        source: ${MCP_WORKSPACE_HOST_PATH:-..}
        target: /opt/workspace
    ports:
      - "${MCP_VNC_BIND_HOST:-127.0.0.1}:${MCP_VNC_PORT:-6080}:6080"
    shm_size: 1g
    mem_limit: ${MCP_MEMORY_LIMIT:-4g}
    cpus: ${MCP_CPU_LIMIT:-2.0}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
